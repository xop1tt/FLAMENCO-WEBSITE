services:
  # Публичный сайт (Next.js). Единственный сервис системы с портом,
  # опубликованным на хост (только 127.0.0.1) — перед ним должен стоять
  # TLS-терминирующий edge-прокси на том же хосте, сам он слушает только HTTP.
  #
  # Backend (бот + веб-API) — отдельный проект со своим compose.yaml. Сайт
  # обращается к его сервису `api` по имени в общей docker-сети
  # `flamenco-web`, которую создаёт compose backend'а — поэтому backend
  # нужно поднять первым.
  frontend:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* переменные Next.js встраивает в клиентский бандл на
        # этапе сборки, а не читает при старте контейнера — поэтому это
        # build arg, а не environment: ниже. Значение берётся из .env рядом
        # с этим файлом (см. .env.example).
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:?Set NEXT_PUBLIC_TELEGRAM_BOT_USERNAME to the bot's public @username}
        # Адрес назначения rewrite /api/* (next.config.ts) Next.js вычисляет
        # при сборке и записывает в .next/routes-manifest.json — environment:
        # ниже на него уже не влияет. Должен совпадать с API_BASE_URL ниже.
        API_BASE_URL: http://api:8000
    image: flamenco-studio-frontend:local
    init: true
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      # Тот же пояс, что у backend (STUDIO_TIMEZONE в его .env).
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-Europe/Moscow}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # Сервер Next.js отвечает на страницу без данных API (/contact) — сайт
    # жив даже при недоступном backend (он показывает «сервис недоступен»).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/contact').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Только на localhost хоста: снаружи сайт доступен лишь через edge-прокси
    # (TLS), который записывает IP клиента в X-Forwarded-For. Прямой доступ к
    # :3000 позволил бы подставить свой X-Forwarded-For и обойти rate limit
    # входа — Next.js передаёт этот заголовок в api как есть.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      flamenco-web:
        # Постоянный адрес, которому доверяет api (FORWARDED_ALLOW_IPS в
        # compose.yaml backend'а). Значения по умолчанию совпадают там и здесь.
        ipv4_address: ${FLAMENCO_FRONTEND_IP:-10.89.250.10}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  flamenco-web:
    external: true
